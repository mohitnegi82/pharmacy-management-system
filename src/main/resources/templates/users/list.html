<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Accounts | PharmaCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">

    <div class="card" style="background:#dcfce7; color:#16a34a;" th:if="${success}">
        <span th:text="${success}"></span>
    </div>
    <div class="card" style="background:#fee2e2; color:#dc2626;" th:if="${error}">
        <span th:text="${error}"></span>
    </div>

    <div class="card">
        <h1>Manage Login Accounts (Admin)</h1>
        <p style="color:#64748b;">Only accounts created here can log into the system &mdash; this is
           separate from Employee HR records. Passwords are BCrypt-hashed before being stored.</p>
        <table>
            <thead><tr><th>Username</th><th>Full Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.username}">username</td>
                <td th:text="${u.fullName}">Name</td>
                <td th:text="${u.email}">Email</td>
                <td th:text="${u.role}">ROLE</td>
                <td>
                    <span th:if="${u.active}" class="badge badge-success">Active</span>
                    <span th:unless="${u.active}" class="badge badge-danger">Inactive</span>
                </td>
                <td>
                    <form th:if="${u.active}" th:action="@{/users/{id}/deactivate(id=${u.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-warning" style="padding:5px 10px;font-size:12px;">Deactivate</button>
                    </form>
                    <form th:unless="${u.active}" th:action="@{/users/{id}/activate(id=${u.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn" style="padding:5px 10px;font-size:12px;">Activate</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card" style="max-width:480px;">
        <h2>Create Login Account</h2>
        <form th:action="@{/users/save}" method="post">
            <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
            <div class="form-group"><label>Full Name</label><input type="text" name="fullName" required></div>
            <div class="form-group"><label>Email</label><input type="email" name="email"></div>
            <div class="form-group">
                <label>Role</label>
                <select name="role" required>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>
    </div>
</div>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
</body>
</html>
