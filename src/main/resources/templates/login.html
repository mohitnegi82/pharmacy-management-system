<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | Pharmacy Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-box">
        <h1>&#128138; PharmaCare</h1>
        <p class="subtitle">Pharmacy Management System &mdash; Pharmacist Login</p>

        <div class="login-error" th:if="${param.error}">
            Invalid username or password.
        </div>
        <div class="login-error" style="background:#dcfce7;color:#16a34a;" th:if="${param.logout}">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>

        <div class="hint-box">
            Default admin account &mdash; username: <b>admin</b> / password: <b>admin123</b>
        </div>
    </div>
</div>
</body>
</html>
