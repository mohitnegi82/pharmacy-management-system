<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Record Purchase | PharmaCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1>Record Purchase (Stock In)</h1>
        <form th:action="@{/purchases/save}" method="post">
            <div class="form-group">
                <label>Supplier</label>
                <select name="supplierId" required>
                    <option value="">-- select supplier --</option>
                    <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name} + ' (' + ${s.contact} + ')'"></option>
                </select>
            </div>

            <h3>Items</h3>
            <table id="itemsTable">
                <thead><tr><th>Medicine</th><th>Quantity</th><th>Unit Price (₹)</th></tr></thead>
                <tbody>
                <tr th:each="m : ${medicines}">
                    <td>
                        <label style="font-weight:normal;">
                            <input type="checkbox" onchange="toggleRow(this)"> <span th:text="${m.name}">Med</span>
                        </label>
                        <input type="hidden" th:value="${m.id}" class="med-id" disabled>
                    </td>
                    <td><input type="number" min="1" class="qty-input" name="quantity" disabled></td>
                    <td><input type="number" step="0.01" class="price-input" name="unitPrice" th:value="${m.price}" disabled></td>
                </tr>
                </tbody>
            </table>

            <button type="submit" class="btn" style="margin-top:16px;">Save Purchase</button>
        </form>
    </div>
</div>

<script>
// Enables quantity/price inputs + adds hidden medicineId field only for checked rows.
function toggleRow(checkbox) {
    const row = checkbox.closest('tr');
    const qty = row.querySelector('.qty-input');
    const price = row.querySelector('.price-input');
    const medIdInput = row.querySelector('.med-id');

    qty.disabled = !checkbox.checked;
    price.disabled = !checkbox.checked;
    medIdInput.disabled = !checkbox.checked;
    medIdInput.name = checkbox.checked ? 'medicineId' : '';
}
</script>
</body>
</html>
