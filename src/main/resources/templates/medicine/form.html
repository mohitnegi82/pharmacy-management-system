<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicine Form | PharmaCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="card" style="max-width:520px;">
        <h2 th:text="${medicine.id} != null ? 'Update Medicine' : 'Add New Medicine'">Medicine Form</h2>
        <form th:action="@{/medicines/save}" th:object="${medicine}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label>Name</label>
                <input type="text" th:field="*{name}" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" th:field="*{category}" placeholder="e.g. Pain Relief, Antibiotic">
            </div>
            <div class="form-group">
                <label>Manufacturer</label>
                <input type="text" th:field="*{manufacturer}">
            </div>
            <div class="form-group">
                <label>Batch No</label>
                <input type="text" th:field="*{batchNo}">
            </div>
            <div class="form-group">
                <label>Expiry Date</label>
                <input type="date" th:field="*{expiryDate}">
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" step="0.01" th:field="*{price}" required>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" th:field="*{quantity}" required>
            </div>
            <div class="form-group">
                <label>Reorder Level</label>
                <input type="number" th:field="*{reorderLevel}">
            </div>
            <button type="submit" class="btn">Save</button>
            <a th:href="@{/medicines}" class="btn" style="background:#64748b;">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
