<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Suppliers | PharmaCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1>Supplier Management</h1>
        <table>
            <thead><tr><th>Name</th><th>Contact</th><th>Email</th><th>Address</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="s : ${suppliers}">
                <td th:text="${s.name}">Name</td>
                <td th:text="${s.contact}">Contact</td>
                <td th:text="${s.email}">Email</td>
                <td th:text="${s.address}">Address</td>
                <td>
                    <form th:action="@{/suppliers/{id}/delete(id=${s.id})}" method="post" style="display:inline;"
                          onsubmit="return confirm('Delete this supplier?');">
                        <button type="submit" class="btn btn-danger" style="padding:5px 10px;font-size:12px;">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card" style="max-width:480px;">
        <h2>Add Supplier</h2>
        <form th:action="@{/suppliers/save}" th:object="${supplier}" method="post">
            <div class="form-group"><label>Name</label><input type="text" th:field="*{name}" required></div>
            <div class="form-group"><label>Contact</label><input type="text" th:field="*{contact}"></div>
            <div class="form-group"><label>Email</label><input type="email" th:field="*{email}"></div>
            <div class="form-group"><label>Address</label><input type="text" th:field="*{address}"></div>
            <button type="submit" class="btn">Add Supplier</button>
        </form>
    </div>
</div>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
</body>
</html>
