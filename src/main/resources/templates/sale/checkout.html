<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout | PharmaCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1>Record Sale (Checkout)</h1>
        <form th:action="@{/sales/checkout}" method="post">
            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" name="customerName" required>
            </div>
            <div class="form-group">
                <label>Customer Phone</label>
                <input type="text" name="customerPhone" id="customerPhone" placeholder="e.g. 9876543210">
            </div>
            <div class="form-group">
                <label style="font-weight:normal; display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" name="sendSms" style="width:auto;">
                    Send bill to customer via SMS (if phone provided)
                </label>
            </div>

            <h3>Select Medicines</h3>
            <input type="text" id="medicineSearch" placeholder="Search medicine by name..."
                   onkeyup="filterMedicines()"
                   style="width:100%; padding:9px 10px; border:1px solid #e2e8f0; border-radius:6px; margin-bottom:10px;">

            <table id="medicineTable">
                <thead><tr><th>Medicine</th><th>Price</th><th>In Stock</th><th>Quantity</th></tr></thead>
                <tbody>
                <tr th:each="m : ${medicines}" class="medicine-row" th:attr="data-name=${#strings.toLowerCase(m.name)}">
                    <td>
                        <label style="font-weight:normal;">
                            <input type="checkbox" onchange="toggleRow(this)"> <span th:text="${m.name}">Med</span>
                        </label>
                        <input type="hidden" th:value="${m.id}" class="med-id" disabled>
                    </td>
                    <td th:text="'₹' + ${m.price}">0</td>
                    <td th:text="${m.quantity}">0</td>
                    <td><input type="number" min="1" th:max="${m.quantity}" class="qty-input" name="quantity" disabled></td>
                </tr>
                </tbody>
            </table>
            <p id="noResults" style="display:none; color:#64748b;">No medicines match your search.</p>

            <button type="submit" class="btn" style="margin-top:16px;">Complete Sale &amp; Generate Invoice</button>
        </form>
    </div>
</div>

<script>
function toggleRow(checkbox) {
    const row = checkbox.closest('tr');
    const qty = row.querySelector('.qty-input');
    const medIdInput = row.querySelector('.med-id');
    qty.disabled = !checkbox.checked;
    medIdInput.disabled = !checkbox.checked;
    medIdInput.name = checkbox.checked ? 'medicineId' : '';
}

// Live client-side search filter for the medicine table, so the pharmacist
// can quickly find a medicine to add to the bill without scrolling a long list.
function filterMedicines() {
    const query = document.getElementById('medicineSearch').value.trim().toLowerCase();
    const rows = document.querySelectorAll('#medicineTable .medicine-row');
    let visibleCount = 0;

    rows.forEach(row => {
        const name = row.getAttribute('data-name') || '';
        const matches = name.includes(query);
        row.style.display = matches ? '' : 'none';
        if (matches) visibleCount++;
    });

    document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
}
</script>
</body>
</html>
